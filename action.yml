name: "conventionalcommits-checker"
author: BLumia
branding:
  icon: "check"
  color: "gray-dark"
description: "check commits insider a Pull Request and see if it matches Conventional Commits guideline"
inputs:
  github_token:
    description: "action github token"
    required: false
  rules:
    description: "JSON string defining all rules (replaces default rules). See README for the JSON format and available enum values."
    required: false
    default: ""
  extra-rules:
    description: "JSON string defining extra rules to append to the current rule set (default or custom). See README for the JSON format and available enum values."
    required: false
    default: ""
  rules-file:
    description: "Path to a JSON file in the repo defining all rules (replaces default rules). Takes priority over `rules`."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: install git
      shell: bash
      run: |
        sudo apt-get install -y -q git
    - name: install golang
      uses: actions/setup-go@v6
      with:
        go-version: ^1.19
    - name: run commitlint
      shell: bash
      env:
        INPUT_RULES_FILE: ${{ inputs.rules-file }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_EXTRA_RULES: ${{ inputs.extra-rules }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        cd $GITHUB_ACTION_PATH
        RULES_ARGS=()
        EXTRA_RULES_ARGS=()
        if [ -n "$INPUT_RULES_FILE" ]; then
          RULES_FILE="$INPUT_RULES_FILE"
          if [[ "$RULES_FILE" != /* ]]; then
            RULES_FILE="$GITHUB_WORKSPACE/$RULES_FILE"
          fi
          RULES_ARGS=(-rules-file "$RULES_FILE")
        elif [ -n "$INPUT_RULES" ]; then
          printf '%s' "$INPUT_RULES" > /tmp/cc_rules.json
          RULES_ARGS=(-rules-file /tmp/cc_rules.json)
        fi
        if [ -n "$INPUT_EXTRA_RULES" ]; then
          printf '%s' "$INPUT_EXTRA_RULES" > /tmp/cc_extra_rules.json
          EXTRA_RULES_ARGS=(-extra-rules-file /tmp/cc_extra_rules.json)
        fi
        go run ./conventionalcommits-checker/ \
          -repo-dir "$GITHUB_WORKSPACE" \
          -base-sha "$BASE_SHA" \
          -head-sha "$HEAD_SHA" \
          "${RULES_ARGS[@]}" \
          "${EXTRA_RULES_ARGS[@]}"
